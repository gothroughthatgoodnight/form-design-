<!doctype html>

<body>

  <header class="topbar">

  <main class="shell" id="main">

      <div class="story-body"><p class="meta"></p><h3><button class="story-title"></button></h3><p class="story-summary"></p><div class="story-footer"><a class="original" target="_blank" rel="noopener noreferrer">查看原文 <span data-icon="external"></span></a><button class="icon-button story-open" title="阅读简报" aria-label="阅读简报" data-icon="arrow"></button></div></div>
