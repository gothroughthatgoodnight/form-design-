name: Update resources and publish Pages

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '23 16 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: form-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned dependencies
        run: npx --yes pnpm@11.25.0 install --prod --frozen-lockfile
      - name: Fetch sources and publish saved snapshots
        run: node publish-pages.mjs --refresh
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Verify published files
        run: node verify-pages.mjs
      - name: Save resource updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data site
          if ! git diff --cached --quiet; then
            git commit -m "Update automotive resources"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy both websites
        id: deployment
        uses: actions/deploy-pages@v4
